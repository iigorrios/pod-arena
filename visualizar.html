<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PODARENA · Visualizar Perguntas</title>
  <link rel="stylesheet" href="arena.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    /* ---- page-level overrides ---- */
    .viz-header {
      background: var(--ink-0);
      border-bottom: 1px solid var(--ink-2);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .viz-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .viz-brand img {
      height: 32px;
      width: auto;
    }
    .viz-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .viz-brand-text .top {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .viz-brand-text .name {
      font-family: var(--font-display);
      font-size: 20px;
      text-transform: uppercase;
      color: var(--bone);
    }

    .viz-main {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    .viz-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .viz-title {
      font-family: var(--font-display);
      font-size: 32px;
      text-transform: uppercase;
      color: var(--bone);
      margin: 0;
    }
    .viz-count {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }

    /* ---- filters ---- */
    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .filter-chip {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 16px;
      border: 1px solid var(--ink-3);
      background: transparent;
      color: var(--fg-dim);
      cursor: pointer;
      transition: all 0.15s var(--ease-out);
    }
    .filter-chip:hover {
      border-color: var(--arena-flame);
      color: var(--arena-flame);
    }
    .filter-chip.active {
      background: var(--arena-flame);
      border-color: var(--arena-flame);
      color: var(--bone);
    }

    /* ---- draw button ---- */
    .draw-btn {
      background: var(--ink-1);
      border: 1px solid var(--ink-3);
      color: var(--bone);
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s var(--ease-out);
    }
    .draw-btn:hover {
      border-color: var(--arena-flame);
      color: var(--arena-flame);
    }
    .draw-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ---- question card ---- */
    .q-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .q-card {
      background: var(--ink-1);
      border-left: 3px solid var(--ink-3);
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s var(--ease-out);
    }
    .q-card:hover {
      border-left-color: var(--arena-flame);
    }
    .q-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .q-card-tema {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--arena-flame);
    }
    .q-card-date {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--fg-dim);
      margin-left: auto;
    }
    .q-card-text {
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      color: var(--bone);
    }

    /* ---- empty / loading ---- */
    .viz-empty {
      padding: 60px 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }

    /* ---- draw overlay ---- */
    .draw-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 4, 3, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 32px;
      animation: fadeIn 0.22s var(--ease-out);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }
    .draw-card {
      background: var(--ink-1);
      border: 2px solid var(--arena-flame);
      max-width: 600px;
      width: 100%;
      padding: 48px 40px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .draw-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--arena-flame);
    }
    .draw-question {
      font-family: var(--font-display);
      font-size: clamp(22px, 4vw, 36px);
      text-transform: uppercase;
      line-height: 1.1;
      color: var(--bone);
    }
    .draw-tema {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .draw-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      .viz-main { padding: 24px 16px 60px; }
      .viz-header { padding: 14px 16px; }
      .draw-card { padding: 32px 24px 28px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SUPABASE_URL = 'https://bnuyslurompyavjbdjnm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJudXlzbHVyb21weWF2amJkam5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk5MzIwNDQsImV4cCI6MjA3NTUwODA0NH0.jO1bNrVmWU2LOkwnevi_y23DRPkUZeOc94CH6W-6XZQ';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TEMAS = [
      { id: 'todos',      label: 'Todos' },
      { id: 'avivamento', label: 'Avivamento' },
      { id: 'constancia', label: 'Constância' },
      { id: 'lideranca',  label: 'Liderança' },
    ];

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function IconDice({ size = 16 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="3" />
          <circle cx="8"  cy="8"  r="1.2" fill="currentColor" />
          <circle cx="16" cy="8"  r="1.2" fill="currentColor" />
          <circle cx="12" cy="12" r="1.2" fill="currentColor" />
          <circle cx="8"  cy="16" r="1.2" fill="currentColor" />
          <circle cx="16" cy="16" r="1.2" fill="currentColor" />
        </svg>
      );
    }

    function IconX({ size = 18 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2.4" strokeLinecap="round">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      );
    }

    function DrawOverlay({ pergunta, onClose, onNew }) {
      return (
        <div className="draw-overlay" onClick={onClose}>
          <div className="draw-card" onClick={e => e.stopPropagation()}>
            <div className="draw-eyebrow">Pergunta sorteada</div>
            <div className="draw-question">{pergunta.texto}</div>
            <div className="draw-tema">Bloco — {pergunta.tema}</div>
            <div className="draw-actions">
              <button className="btn btn-primary" onClick={onNew}>
                <IconDice size={14} /> Sortear outra
              </button>
              <button className="btn btn-ghost" onClick={onClose}>
                <IconX size={14} /> Fechar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [perguntas, setPerguntas] = useState([]);
      const [loading, setLoading]     = useState(true);
      const [filtro, setFiltro]       = useState('todos');
      const [drawn, setDrawn]         = useState(null);

      useEffect(() => {
        async function load() {
          const { data, error } = await db
            .from('perguntas')
            .select('*')
            .order('created_at', { ascending: false });
          if (!error) setPerguntas(data || []);
          setLoading(false);
        }
        load();
      }, []);

      const filtradas = filtro === 'todos'
        ? perguntas
        : perguntas.filter(p => p.tema_id === filtro);

      const sortear = useCallback(() => {
        if (filtradas.length === 0) return;
        const idx = Math.floor(Math.random() * filtradas.length);
        setDrawn(filtradas[idx]);
      }, [filtradas]);

      return (
        <React.Fragment>
          <header className="viz-header">
            <div className="viz-brand">
              <img src="assets/logo-arena-white-trim.png" alt="Arena" />
              <div className="viz-brand-text">
                <span className="top">Arena Lifestyle</span>
                <span className="name">PODARENA</span>
              </div>
            </div>
            <span className="chip chip-flame">
              <span className="dot"></span>Perguntas
            </span>
          </header>

          <main className="viz-main">
            <div className="viz-topbar">
              <h1 className="viz-title">Perguntas</h1>
              <span className="viz-count">
                {loading ? '…' : `${filtradas.length} pergunta${filtradas.length !== 1 ? 's' : ''}`}
              </span>
            </div>

            <div className="filter-row">
              {TEMAS.map(t => (
                <button
                  key={t.id}
                  className={"filter-chip" + (filtro === t.id ? " active" : "")}
                  onClick={() => setFiltro(t.id)}>
                  {t.label}
                </button>
              ))}
              <button
                className="draw-btn"
                onClick={sortear}
                disabled={filtradas.length === 0}
                style={{ marginLeft: 'auto' }}>
                <IconDice size={15} />
                Sortear pergunta
              </button>
            </div>

            {loading ? (
              <div className="viz-empty">Carregando…</div>
            ) : filtradas.length === 0 ? (
              <div className="viz-empty">Nenhuma pergunta ainda.</div>
            ) : (
              <div className="q-list">
                {filtradas.map(p => (
                  <div key={p.id} className="q-card">
                    <div className="q-card-meta">
                      <span className="q-card-tema">{p.tema}</span>
                      <span className="q-card-date">{formatDate(p.created_at)}</span>
                    </div>
                    <div className="q-card-text">{p.texto}</div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {drawn && (
            <DrawOverlay
              pergunta={drawn}
              onClose={() => setDrawn(null)}
              onNew={sortear}
            />
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
